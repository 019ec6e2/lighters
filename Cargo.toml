[package]
name = "lighter"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Native Rust signer & client for the Lighter exchange (port of lighter-go)"
repository = "https://github.com/elliottech/lighter-go"
keywords = ["lighter", "exchange", "schnorr", "goldilocks", "signing"]
categories = ["cryptography", "api-bindings"]

[dependencies]
# Cryptography: ECgFp5 curve + Schnorr signatures, built on Poseidon2/Goldilocks.
# These cover the exact primitives used by the Go reference implementation, so
# we never hand-roll any crypto ourselves.
goldilocks-crypto = "0.1.2"
poseidon-hash = "0.1.4"

hex = "0.4"
base64 = "0.22"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# HTTP transport, shared by the (blocking) `http` feature and the (async)
# `trading` feature. `http` adds the blocking client used to fetch nonces /
# api-keys (mirrors the Go SDK's MinimalHTTPClient); `trading` uses the async
# client for the full online trading runtime. Build with
# `default-features = false` for a pure offline signer.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["http"]
# Lightweight blocking client (offline signer + nonce/api-key lookups).
http = ["dep:reqwest", "reqwest/blocking"]
# Full async trading runtime: REST submission, nonce manager, order-book reads
# and high-level order helpers. Bring your own async runtime (e.g. tokio).
trading = ["dep:reqwest"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[package.metadata.docs.rs]
all-features = true
